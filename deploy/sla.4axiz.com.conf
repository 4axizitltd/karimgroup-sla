# Apache vhost for sla.4axiz.com (HTTP). Certbot adds the :443 file:
#   certbot --apache -d sla.4axiz.com --no-redirect
# /api -> Laravel (api/public), everything else -> Next.js admin on 127.0.0.1:3010
# Needs: a2enmod proxy proxy_http rewrite
<VirtualHost *:80>
    ServerName sla.4axiz.com
    DocumentRoot /var/www/sla.4axiz.com/api/public

    <Directory /var/www/sla.4axiz.com/api/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ProxyPreserveHost On
    ProxyPass /api !
    ProxyPass /index.php !
    ProxyPass /.well-known !
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/sla.4axiz.com-error.log
    CustomLog ${APACHE_LOG_DIR}/sla.4axiz.com-access.log combined
</VirtualHost>
